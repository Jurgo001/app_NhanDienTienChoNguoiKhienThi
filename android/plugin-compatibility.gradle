
subprojects { p ->
    p.afterEvaluate {
        if (p.name == 'tflite_flutter') {
            // Keep Java bytecode aligned with the Kotlin target below.
            p.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            p.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17

            p.tasks.matching {
                it.name.startsWith('compile') &&
                it.name.endsWith('Kotlin')
            }.configureEach {
                kotlinOptions.jvmTarget = '17'
            }
        }

        if (p.name == 'camera_android_camerax') {
            p.dependencies.add(
                'implementation',
                'androidx.concurrent:concurrent-futures:1.1.0'
            )
        }
    }
}
