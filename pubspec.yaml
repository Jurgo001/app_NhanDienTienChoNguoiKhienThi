name: app_ho_tro_nguoi_khiem_thi
description: Giao diện nhận diện mệnh giá tiền Việt Nam hỗ trợ người khiếm thị.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  camera: ^0.11.0+2
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  permission_handler: ^11.3.1
  flutter_tts: ^4.2.3
  shared_preferences: ^2.5.6
  vibration: ^3.2.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  archive: ^4.5.2
  camera_platform_interface: ^2.15.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/models/
